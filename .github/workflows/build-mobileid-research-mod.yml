name: Build redacted MAX Mobile ID research APK
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-mobileid-research-mod.yml"
      - "tools/patch_mobileid_diagnostics.py"
permissions:
  contents: read
concurrency:
  group: max-mobileid-research-mod-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download and verify exact original APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/max-research
          gh release download apk-26.35.1-6867 --pattern base.apk --dir /tmp/max-research
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path("/tmp/max-research/base.apk")
          original=json.loads(pathlib.Path("evidence/sample.json").read_text())
          with p.open("rb") as f:
              digest=hashlib.file_digest(f,"sha256").hexdigest()
          assert p.stat().st_size==original["bytes"] and digest==original["sha256"],"Unexpected base APK"
          print("Verified source APK", digest, p.stat().st_size)
          PY
      - name: Obtain official APKTool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/iBotPeaches/Apktool/releases/latest --jq '.assets[] | select(.name | test("^apktool_[0-9].*\\.jar$")) | .browser_download_url' | head -n 1 > /tmp/max-research/apktool-url.txt
          test -s /tmp/max-research/apktool-url.txt
          curl -fsSL --retry 3 --retry-delay 5 --max-time 180 "$(cat /tmp/max-research/apktool-url.txt)" -o /tmp/max-research/apktool.jar
          java -jar /tmp/max-research/apktool.jar --version
      - name: Decode, instrument only event milestones, and rebuild
        run: |
          set -euo pipefail
          java -Xmx6g -jar /tmp/max-research/apktool.jar d -f -r /tmp/max-research/base.apk -o /tmp/max-research/decoded
          python3 tools/patch_mobileid_diagnostics.py /tmp/max-research/decoded
          java -Xmx6g -jar /tmp/max-research/apktool.jar b /tmp/max-research/decoded -o /tmp/max-research/unsigned.apk
      - name: Align, sign with an isolated research key and verify
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}"
          BIN="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$BIN"
          TOOLS_DIR="$(dirname "$BIN")"
          "$TOOLS_DIR/zipalign" -f -p 4 /tmp/max-research/unsigned.apk /tmp/max-research/aligned.apk
          keytool -genkeypair -keyalg RSA -keysize 3072 -validity 365 -keystore /tmp/max-research/research.jks -alias research -storepass 'local-research-test' -keypass 'local-research-test' -dname 'CN=MAX RESEARCH MOD (UNTRUSTED)' -noprompt
          "$BIN" sign --ks /tmp/max-research/research.jks --ks-key-alias research --ks-pass 'pass:local-research-test' --key-pass 'pass:local-research-test' --out /tmp/max-research/MAX_26.35.1_MobileID_Research.apk /tmp/max-research/aligned.apk
          "$BIN" verify --verbose --print-certs /tmp/max-research/MAX_26.35.1_MobileID_Research.apk
          sha256sum /tmp/max-research/MAX_26.35.1_MobileID_Research.apk | tee /tmp/max-research/SHA256SUMS.txt
          printf '%s\n' 'Research mod records ONLY event timestamps and event names. No credentials, tokens, phone or SIM identifiers, operator proof, URLs, headers or codes are collected.' 'Separate test signature. Not compatible with official app installation; runtime not verified.' > /tmp/max-research/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MAX-MobileID-Research-Mod-26.35.1
          path: |
            /tmp/max-research/MAX_26.35.1_MobileID_Research.apk
            /tmp/max-research/SHA256SUMS.txt
            /tmp/max-research/README.txt
          retention-days: 14
          if-no-files-found: error
